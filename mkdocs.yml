site_name: Masterplan Optimiser App
site_description: Desktop application documentation for Masterplan Optimiser.
repo_url: https://github.com/Brian-Funk/masterplanOptimiserV3---App
repo_name: Brian-Funk/masterplanOptimiserV3---App
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Setup: setup.md
  - Architecture: architecture.md
  - Workflows: workflows.md
  - Deployment: deployment.md
  - Security: security.md
  - Workstation Storage Security: workstation-storage-security.md
  - Privacy and Deletion: privacy-deletion.md
  - Contributing: contributing.md
  - API Reference:
      - Python Overview: generated/python/index.md
      - Backend API: generated/python/backend.md
      - Compute API: generated/python/compute.md
      - TypeScript API: generated/typescript/README.md

not_in_nav: |
  generated/typescript/**

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - backend
            - compute/src
          options:
            docstring_style: google
            docstring_options:
              warn_unknown_params: false
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
