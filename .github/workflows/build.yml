name: Build Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing signed release tag to recover, for example v3.8.0
        required: false
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Verify build and release preconditions
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_commit: ${{ steps.release.outputs.release_commit }}
    permissions:
      contents: read
      checks: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify immutable public release preconditions
        id: release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          npm --prefix desktop run audit:publication:history
          python tools/licensing/generate_third_party_notices.py --check
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          expected_version="${TAG#v}"
          [[ "$(node -p 'require("./desktop/package.json").version')" == "$expected_version" ]]
          [[ "$(node -p 'require("./web/package.json").version')" == "$expected_version" ]]
          [[ "$(python3 -c 'import tomllib; print(tomllib.load(open("compute/pyproject.toml", "rb"))["project"]["version"])')" == "$expected_version" ]]
          git fetch origin main --quiet
          tag_commit="$(git rev-parse "$TAG^{commit}")"
          [[ "$(git rev-parse HEAD)" == "$tag_commit" ]]
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "$tag_commit" == "$GITHUB_SHA" ]]
            [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]]
          else
            [[ "$GITHUB_REF" == refs/heads/main ]]
            [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]]
            git merge-base --is-ancestor "$tag_commit" origin/main
          fi
          [[ -z "$(gh release view "$TAG" --json id --jq .id 2>/dev/null || true)" ]]
          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          tag_object="$(jq -er '.object.sha' <<< "$tag_ref")"
          tag_record="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}")"
          jq -e --arg commit "$tag_commit" \
            '.verification.verified == true and .object.type == "commit" and .object.sha == $commit' \
            <<< "$tag_record" >/dev/null
          check="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag_commit}/check-runs" \
            --jq '([.check_runs[] | select(.name == "desktop-ci-result")] | sort_by(.id) | last) // {}')"
          status="$(jq -r '.status // "missing"' <<< "$check")"
          conclusion="$(jq -r '.conclusion // "missing"' <<< "$check")"
          [[ "$status" == completed && "$conclusion" == success ]] || {
            echo "desktop-ci-result is $status/$conclusion for $tag_commit" >&2
            exit 1
          }
          repository="$(env -u GH_TOKEN -u GITHUB_TOKEN \
            curl --fail --silent --show-error \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}")"
          jq -e '.private == false and .visibility == "public"' <<< "$repository" >/dev/null || {
            echo "The App repository must be public before release artefacts are built." >&2
            exit 1
          }
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_commit=$tag_commit" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_cmd: npm run build:win
            artefact_glob: "*.exe"
          - os: macos-latest
            build_cmd: npm run build:mac
            artefact_glob: "*.dmg"
          - os: ubuntu-latest
            build_cmd: npm run build:linux
            artefact_glob: "*.AppImage"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.preflight.outputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      # --- Backend (includes compute/optimiser) ---
      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --constraint requirements.lock.txt -r requirements.txt -r ../compute/requirements.txt
          pip install --constraint requirements.lock.txt -r requirements-build.txt
          pip check

      - name: Package backend with PyInstaller
        working-directory: backend
        shell: bash
        run: |
          pyinstaller --noconfirm --onedir --name backend \
            --paths . \
            --paths ../compute/src \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import uvicorn.lifespan.off \
            --hidden-import sqlalchemy.dialects.sqlite \
            --hidden-import pydantic_settings \
            --hidden-import multipart \
            --hidden-import flow_checker \
            --hidden-import fatigue_optimizer \
            --copy-metadata keyring \
            --collect-submodules app \
            --collect-submodules keyring \
            --collect-submodules ortools \
            app/main.py
          cp .env.desktop dist/backend/.env.desktop

      # --- Web frontend ---
      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Audit web production dependencies
        working-directory: web
        run: npm audit --omit=dev

      - name: Build web frontend
        working-directory: web
        env:
          MP_PUBLIC_SOURCE_REPOSITORY_URL: https://github.com/${{ github.repository }}
          MP_PUBLIC_SOURCE_REVISION: ${{ needs.preflight.outputs.release_commit || github.sha }}
          MP_PUBLIC_SOURCE_URL: https://github.com/${{ github.repository }}/tree/${{ needs.preflight.outputs.release_commit || github.sha }}
        run: npm run build

      - name: Prepare standalone frontend
        working-directory: web
        shell: bash
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

      # --- Desktop ---
      - name: Ensure PyInstaller binaries are executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod -R +x backend/dist/backend/ || true

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Audit desktop dependencies
        working-directory: desktop
        run: npm run audit:security

      - name: Build desktop app
        working-directory: desktop
        run: ${{ matrix.build_cmd }}
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}

      - name: Smoke test packaged desktop app
        if: runner.os != 'Linux'
        working-directory: desktop
        run: |
          npm run test:packaged-smoke
          npm run test:packaged-smoke

      - name: Smoke test packaged desktop app on Linux
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          xvfb-run -a npm run test:packaged-smoke
          xvfb-run -a npm run test:packaged-smoke

      - name: Upload artefacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/${{ matrix.artefact_glob }}
          if-no-files-found: error

  release:
    needs:
      - preflight
      - build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.preflight.outputs.release_tag }}
    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artefacts
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Generate checksums
        working-directory: artefacts
        shell: bash
        run: |
          set -Eeuo pipefail
          version="${TAG#v}"
          expected=(
            "Masterplan-Optimiser-${version}.exe"
            "Masterplan-Optimiser-${version}-arm64.dmg"
            "Masterplan-Optimiser-${version}.AppImage"
          )
          for artefact in "${expected[@]}"; do
            [[ -f "$artefact" ]] || {
              echo "Missing expected release artefact: $artefact" >&2
              exit 1
            }
          done
          sha256sum "${expected[@]}" > checksums.txt
          cat checksums.txt

      - name: Sign and verify checksum manifest
        working-directory: artefacts
        shell: bash
        run: |
          set -Eeuo pipefail
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          cosign sign-blob --yes --bundle checksums.txt.bundle checksums.txt
          cosign verify-blob --bundle checksums.txt.bundle \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$identity" \
            checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artefacts/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          name: ${{ needs.preflight.outputs.release_tag }}
          tag_name: ${{ needs.preflight.outputs.release_tag }}

      - name: Verify anonymous public release
        shell: bash
        run: |
          set -Eeuo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          version="${TAG#v}"
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          release="$(curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          jq -e --arg tag "$TAG" \
            '.tag_name == $tag and .name == $tag and .draft == false and .prerelease == false' \
            <<< "$release" >/dev/null
          verification_dir="$(mktemp -d)"
          trap 'rm -rf "$verification_dir"' EXIT
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          for asset in \
              "Masterplan-Optimiser-${version}.exe" \
              "Masterplan-Optimiser-${version}-arm64.dmg" \
              "Masterplan-Optimiser-${version}.AppImage" \
              checksums.txt checksums.txt.bundle; do
            curl --fail --location --silent --show-error \
              --retry 12 --retry-all-errors --retry-delay 5 \
              "${base}/${asset}" --output "${verification_dir}/${asset}"
          done
          cd "$verification_dir"
          cosign verify-blob --bundle checksums.txt.bundle \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$identity" \
            checksums.txt
          sha256sum -c checksums.txt
