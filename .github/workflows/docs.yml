name: Documentation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "backend/app/**"
      - "compute/src/**"
      - "web/src/**"
      - "web/typedoc.json"
      - "web/tsconfig.json"
      - "web/package.json"
      - "web/package-lock.json"
      - ".github/workflows/docs.yml"
      - ".github/CODEOWNERS"
  workflow_dispatch:

permissions:
  contents: read

env:
  DISABLE_MKDOCS_2_WARNING: "true"

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install documentation dependencies
        run: python -m pip install --require-hashes -r docs/requirements.lock.txt

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Generate TypeScript API docs
        working-directory: web
        run: npm run docs:typedoc

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Upload GitHub Pages artefact
        if: github.event_name != 'pull_request' && (github.event.repository.visibility == 'public' || !endsWith(github.repository, '-Public'))
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy-docs:
    name: Deploy documentation
    needs: build-docs
    if: github.event_name != 'pull_request' && (github.event.repository.visibility == 'public' || !endsWith(github.repository, '-Public'))
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
